<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MeshtasticBot{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 1rem; }
    .nav-link.active { font-weight: 600; }
    .table td, .table th { vertical-align: middle; }
  </style>
</head>
<body>
<div class="container-fluid">
  <nav class="navbar navbar-expand navbar-dark bg-dark rounded mb-4 px-3">
    <a class="navbar-brand" href="/">📡 MeshtasticBot</a>
    <div class="navbar-nav">
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Logs</a>
      <a class="nav-link {% if request.path == '/status' %}active{% endif %}" href="/status">Status</a>
    </div>
  </nav>
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
