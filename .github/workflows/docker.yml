name: Docker Build & Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/meshtasticbot

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (full history for GitVersion)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Build Docker tags
        id: tags
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SEMVER="${{ steps.gitversion.outputs.semVer }}"
          TAGS="${IMAGE}:${SEMVER}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            MAJOR="${{ steps.gitversion.outputs.major }}"
            MINOR="${{ steps.gitversion.outputs.minor }}"
            TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR},${IMAGE}:${MAJOR},${IMAGE}:latest"

          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TAGS="${TAGS},${IMAGE}:main"

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAGS="${TAGS},${IMAGE}:pr-${{ github.event.number }}"

          else
            # Feature / hotfix branches — sanitise to a valid Docker tag
            BRANCH=$(echo "${{ github.ref_name }}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's|[^a-z0-9._-]|-|g' \
              | sed 's|-\+|-|g' \
              | sed 's|^-||; s|-$||' \
              | cut -c1-128)
            TAGS="${TAGS},${IMAGE}:${BRANCH}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Docker tags::${TAGS}"

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skip login on pull requests from forks (no write access to GITHUB_TOKEN)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only when we have registry credentials (not fork PRs)
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=MeshtasticBot
            org.opencontainers.image.description=Meshtastic LoRa mesh network bot
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
