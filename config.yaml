# MeshtasticBot configuration

# Which channel index to listen on and reply to (0-based, so channel 2 = index 2)
channel: 2

connection:
  # type: serial | tcp | ble
  type: serial
  port: /dev/ttyUSB1
  # serial: leave 'port' unset for auto-detection, or set explicitly:
  # port: /dev/ttyUSB0

  # tcp: set 'host' to the node's IP address or hostname
  # host: 192.168.1.100

  # ble: leave 'address' unset for auto-detection, or set a MAC / device name:
  # address: "AA:BB:CC:DD:EE:FF"

# Message logging — stores broadcast messages from the specified channel to SQLite
message_log:
  enabled: true
  channel: 1          # channel index to log (independent of the bot's reply channel)
  db_path: data/messages.db
  retain_days: 365    # messages older than this are deleted daily

# Web UI — read-only log viewer and status dashboard (http://localhost:8080)
web:
  enabled: true
  port: 8080

weather:
  enabled: true
  # Norwegian county code (fylkesnummer). 42 = Agder.
  # See https://api.met.no/weatherapi/metalerts/2.0/documentation for valid codes.
  county: 42
  # How often to check for new alerts (in seconds). Default: 3600 (1 hour)
  interval_seconds: 3600

# Administrator credentials for protected web pages (/audit, ban management)
admin:
  username: admin
  password: changeme

# Rate limiting — token bucket to prevent spam while allowing short bursts
# bucket_size: max tokens a sender can accumulate (default: 5)
# refill_rate: tokens added per second (default: 0.1 = 1 token per 10 seconds)
# Command costs: /ping /help /whois = 1,  /nodes /radio /alert /calling /mvhf = 2,
#                /weather /24hour /bandplan /krslog /krslast = 3
rate_limit:
  bucket_size: 5
  refill_rate: 0.1
