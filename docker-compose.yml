version: "3.8"

services:
  meshtasticbot:
    image: ghcr.io/chhenni/meshtasticbot:latest
    restart: unless-stopped
    tty: true
    ports:
      - "8082:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - bot_data:/app/data
    devices:
      - /dev/meshtastic:/dev/meshtastic   # Meshtastic node (set up udev rule)
      - /dev/flipper:/dev/flipper         # Flipper Zero (set up udev rule)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  bot_data:
