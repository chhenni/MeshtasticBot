version: "3.8"

services:
  meshtasticbot:
    build: .
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - bot_data:/app/data
    # Serial connection: uncomment and adjust device path
    devices:
      - /dev/ttyUSB1:/dev/ttyUSB1
    # BLE connection: uncomment to share host network and D-Bus
    #network_mode: host
    #volumes:
    #  - ./config.yaml:/app/config.yaml:ro
    #  - /run/dbus:/run/dbus:ro
    #  - bot_data:/app/data

volumes:
  bot_data:
